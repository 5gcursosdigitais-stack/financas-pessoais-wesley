<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wesley Finanças Pro v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #18181a; color: #e0e0e0; }
    .app-wrapper { display: flex; flex-direction: column; height: 100vh; }
    .app-content { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; gap: 12px; flex-wrap: wrap; }
    .app-title { font-size: 2rem; font-weight: 900; color: #00d4ff; letter-spacing: 1px; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .icon-btn { width: 50px; height: 50px; min-width: 50px; border-radius: 12px; background: #23232b; border: 2px solid #27272a; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; transition: all 0.3s; }
    .icon-btn:hover { background: #00d4ff; color: #18181a; transform: translateY(-2px); }
    .card { background: #23232b; border: 1px solid #27272a; border-radius: 18px; padding: 22px; margin-bottom: 18px; box-shadow: 0 2px 12px #0002; transition: border 0.3s; }
    .card-title { font-size: 0.9rem; color: #a1a1aa; margin-bottom: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .balance-value { font-size: 2.8rem; font-weight: 900; color: #00d4ff; margin: 12px 0; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; margin-top: 16px; }
    .kpi-item { background: #23232b; padding: 16px; border-radius: 12px; text-align: center; }
    .kpi-label { font-size: 0.8rem; color: #a1a1aa; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; }
    .kpi-value { font-size: 1.3rem; font-weight: 900; color: #00d4ff; }
    .progress-bar { width: 100%; height: 10px; background: #23232b; border-radius: 5px; overflow: hidden; margin: 12px 0; }
    .progress-fill { height: 100%; background: #00d4ff; transition: width 0.6s; }
    .btn { min-height: 62px; padding: 16px 24px; font-size: 17px; font-weight: 700; border: none; border-radius: 14px; cursor: pointer; transition: all 0.3s; width: 100%; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .btn-primary { background: #00d4ff; color: #18181a; }
    .btn-primary:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 8px 24px #00d4ff33; }
    .btn-secondary { background: #23232b; color: #00d4ff; border: 2px solid #00d4ff; }
    .btn-secondary:hover { background: #00d4ff; color: #18181a; }
    .btn-danger { background: #2a1a1e; color: #f43f5e; border: 2px solid #f43f5e; }
    .btn-danger:hover { background: #f43f5e; color: white; }
    .input-field { width: 100%; min-height: 54px; padding: 14px 16px; font-size: 17px; border: 2px solid #27272a; border-radius: 12px; background: #23232b; color: #e0e0e0; margin-bottom: 16px; }
    .input-field:focus { outline: none; border-color: #00d4ff; box-shadow: 0 0 0 3px #00d4ff22; }
    .form-label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px; color: #a1a1aa; text-transform: uppercase; }
    .type-switcher { display: flex; background: #23232b; padding: 4px; border-radius: 12px; gap: 4px; margin-bottom: 20px; }
    .type-option { flex: 1; padding: 14px; border: none; border-radius: 10px; background: transparent; color: #a1a1aa; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .type-option.active { background: #00d4ff; color: #18181a; }
    .tx-item { display: flex; justify-content: space-between; padding: 16px; background: #23232b; border-radius: 12px; margin-bottom: 12px; border-left: 5px solid #27272a; align-items: center; }
    .tx-item:hover { border-left-color: #00d4ff; }
    .tx-info { flex: 1; }
    .tx-main { font-weight: 700; margin-bottom: 4px; color: #e0e0e0; }
    .tx-sub { font-size: 0.85rem; color: #a1a1aa; }
    .tx-amount { font-weight: 900; font-size: 1.2rem; text-align: right; margin-right: 10px; }
    .tx-income { color: #10b981; }
    .tx-expense { color: #f43f5e; }
    .tx-delete { background: none; border: none; cursor: pointer; font-size: 1.3rem; color: #f43f5e; }
    .nav-dock { position: fixed; bottom: 0; left: 0; width: 100%; background: #18181a; border-top: 1px solid #27272a; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 8px; z-index: 1000; }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: #a1a1aa; padding: 8px; border-radius: 12px; transition: all 0.3s; font-weight: 600; }
    .nav-btn.active { color: #00d4ff; background: #00d4ff22; }
    .nav-icon { font-size: 1.6rem; }
    .nav-text { font-size: 0.7rem; text-transform: uppercase; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 9999; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #23232b; border: 1px solid #27272a; border-radius: 22px 22px 0 0; padding: 28px; width: 100%; max-width: 100%; max-height: 85vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .modal-title { font-size: 1.6rem; font-weight: 900; }
    .modal-close { width: 44px; height: 44px; border-radius: 12px; background: #23232b; border: none; font-size: 1.3rem; cursor: pointer; color: #00d4ff; }
    .modal-close:hover { background: #00d4ff; color: #18181a; }
    .feedback { position: fixed; top: 20px; right: 20px; padding: 16px 22px; border-radius: 12px; font-weight: 700; z-index: 11000; animation: slideIn 0.3s; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .feedback.success { background: #10b981; color: white; }
    .feedback.error { background: #f43f5e; color: white; }
    .chart-container { position: relative; height: 250px; margin: 16px 0; background: #23232b; border-radius: 12px; padding: 10px; }
    .empty-state { text-align: center; padding: 30px 20px; color: #a1a1aa; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .health-circle { width: 64px; height: 64px; border-radius: 50%; background: #00d4ff; color: #18181a; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.4rem; box-shadow: 0 0 0 4px #00d4ff22; }
    @media (max-width: 600px) { .app-content { padding: 8px; padding-bottom: 100px; } .modal-content { padding: 12px; } }
  </style>
</head>
